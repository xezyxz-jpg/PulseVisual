name: Build XZ Visuals
on:
  pull_request:
  push:
    branches: [main, xz-visuals-rebrand]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xzvisuals-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and regression tests
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: xzvisuals-2.2.1
          path: |
            build/libs/xzvisuals-2.2.1.jar
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version already published; bump mod_version to publish changes."
            exit 0
          fi
          jar="build/libs/xzvisuals-$version.jar"
          test -f "$jar"
          git archive --format=zip --prefix=XZ-Visuals/ HEAD > "XZ-Visuals-$version-sources.zip"
          gh release create "$tag" "$jar" "XZ-Visuals-$version-sources.zip" --target "$GITHUB_SHA" --title "XZ Visuals $version" --notes-file RELEASE_NOTES.md
